name: temporary-p1-functional
on:
  push:
    branches:
      - repair/stability
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/stability
          fetch-depth: 0
      - name: Apply P1 functional patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('app.js').read_text()
          index = Path('index.html').read_text()
          style = Path('style.css').read_text()

          old = '''function updateDragonBreathUses() {

    const dragonBreath =
        abilities.find(
            ability =>
                ability.id === "dragons-breath"
        );

    const dragonLicorice =
        inventoryItems.find(
            item =>
                item.id === "dragon-licorice" &&
                item.quantity > 0
        );

    if (!dragonBreath) {
        return;
    }

    const baseUses = 1;

    const bonusUses =
        dragonLicorice ? 1 : 0;

    dragonBreath.maximumUses =
        baseUses + bonusUses;

    if (
        dragonBreath.currentUses >
        dragonBreath.maximumUses
    ) {
        dragonBreath.currentUses =
            dragonBreath.maximumUses;
    }
}'''
          new = '''function updateDragonBreathUses() {

    const dragonBreath =
        abilities.find(
            ability =>
                ability.id === "dragons-breath"
        );

    const dragonLicorice =
        inventoryItems.find(
            item =>
                (
                    item.id === "dragon-licorice" ||
                    String(item.name || "").trim().toLowerCase() ===
                        "dragon licorice"
                ) &&
                Number(item.quantity) > 0
        );

    if (!dragonBreath) {
        return;
    }

    const baseUses = 1;

    const bonusUses =
        dragonLicorice ? 1 : 0;

    dragonBreath.maximumUses =
        baseUses + bonusUses;

    if (
        dragonBreath.currentUses >
        dragonBreath.maximumUses
    ) {
        dragonBreath.currentUses =
            dragonBreath.maximumUses;
    }
}'''
          if old not in app:
              raise SystemExit('Dragon Breath function pattern not found')
          app = app.replace(old, new, 1)

          old = '''        linkedItems: [],
        description:
            "You have one additional use of Dragon's Breath per long rest."'''
          new = '''        linkedItems: [
            "dragon-licorice"
        ],
        description:
            "You have one additional use of Dragon's Breath per long rest while you possess Dragon Licorice."'''
          if old not in app:
              raise SystemExit('Dragon Licorice ability pattern not found')
          app = app.replace(old, new, 1)

          old = '''const inventoryItems =
    savedInventory ||
    defaultInventoryItems;

updateDragonBreathUses();'''
          new = '''const inventoryItems =
    savedInventory ||
    defaultInventoryItems;

// Ensure the character's Dragon Licorice exists even when an older
// localStorage inventory predates the item.
if (
    !inventoryItems.some(
        item =>
            item.id === "dragon-licorice" ||
            String(item.name || "").trim().toLowerCase() ===
                "dragon licorice"
    )
) {

    inventoryItems.push({
        id: "dragon-licorice",
        name: "Dragon Licorice",
        category: "miscellaneous",
        location: "miscellaneous",
        icon: "🍬",
        description:
            "A piece of enchanted licorice that grants one additional use of Dragon's Breath after a long rest.",
        quantity: 1,
        weight: null,
        equipped: false,
        magical: true,
        properties: [
            "Grants +1 Dragon's Breath use"
        ],
        tags: [
            "Utility",
            "Magical"
        ],
        originalLocation: "miscellaneous"
    });
}

updateDragonBreathUses();'''
          if old not in app:
              raise SystemExit('inventory initialization pattern not found')
          app = app.replace(old, new, 1)

          old = '''                                            const item =
                                                inventoryItems.find(
                                                    item =>
                                                        item.id ===
                                                        itemId
                                                );'''
          new = '''                                            const item =
                                                inventoryItems.find(
                                                    item =>
                                                        item.id ===
                                                        itemId
                                                        ||
                                                        (
                                                            itemId ===
                                                            "dragon-licorice"
                                                            &&
                                                            String(item.name || "")
                                                                .trim()
                                                                .toLowerCase() ===
                                                            "dragon licorice"
                                                        )
                                                );'''
          if old not in app:
              raise SystemExit('linked item lookup pattern not found')
          app = app.replace(old, new, 1)

          old = '''    saveSpellSlots();

    closeRestMenu();'''
          new = '''    saveSpellSlots();

    // Long Rest restores all ability resources as well.
    updateDragonBreathUses();
    resetAbilityUses();

    closeRestMenu();'''
          if old not in app:
              raise SystemExit('long rest save pattern not found')
          app = app.replace(old, new, 1)

          old = '''    item.quantity--;


    saveInventory();'''
          new = '''    item.quantity--;

    // Inventory-linked abilities must react immediately to quantity changes.
    updateDragonBreathUses();

    saveInventory();
    saveAbilityState();'''
          if old not in app:
              raise SystemExit('consume pattern not found')
          app = app.replace(old, new, 1)

          old = '''                    <div class="hp-controls">

                        <button'''
          new = '''                    <div class="hp-bar" aria-hidden="true">
                        <div
                            id="hp-bar-fill"
                            class="hp-bar-fill"
                        ></div>
                    </div>

                    <div class="hp-controls">

                        <button'''
          if old not in index:
              raise SystemExit('HP controls insertion point not found')
          index = index.replace(old, new, 1)

          old = '''    if (hp) {
        hp.textContent = currentHP;
    }

}'''
          new = '''    if (hp) {
        hp.textContent = currentHP;
    }

    const hpBar =
        document.getElementById(
            "hp-bar-fill"
        );

    if (hpBar) {
        const percentage =
            maximumHP > 0
                ? (currentHP / maximumHP) * 100
                : 0;

        hpBar.style.width =
            `${percentage}%`;
    }

    const maximumHp =
        document.getElementById(
            "maximum-hp"
        );

    if (maximumHp) {
        maximumHp.textContent = maximumHP;
    }

}'''
          if old not in app:
              raise SystemExit('updateHP pattern not found')
          app = app.replace(old, new, 1)

          marker = '/* ========================================\n   P1 HP BAR\n======================================== */'
          if marker not in style:
              style += '''\n\n\n/* ========================================\n   P1 HP BAR\n======================================== */\n\n.hp-bar {\n    width: 100%;\n    height: 8px;\n    margin: 4px 0 14px;\n    background: var(--surface-light);\n    border: 1px solid var(--border);\n    border-radius: 999px;\n    overflow: hidden;\n}\n\n.hp-bar-fill {\n    width: 100%;\n    height: 100%;\n    background: var(--accent);\n    border-radius: inherit;\n    transition: width 0.18s ease;\n}\n'''

          Path('app.js').write_text(app)
          Path('index.html').write_text(index)
          Path('style.css').write_text(style)
          PY

          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css
          git rm .github/workflows/p1-functional.yml
          git commit -m "feat: restore P1 resources and HP bar"
          git push origin repair/stability
