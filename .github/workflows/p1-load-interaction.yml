name: temporary-p1-load-interaction
on:
  push:
    branches:
      - repair/stability
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/stability
          fetch-depth: 0
      - name: Add interaction layer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          marker = '    <script src="p1-interaction.js"></script>'
          if marker not in text:
              anchor = '    <script src="p1-recovery.js"></script>'
              if anchor not in text:
                  raise SystemExit('p1-recovery script tag not found')
              text = text.replace(anchor, anchor + '\n' + marker, 1)
              path.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/p1-load-interaction.yml
          git commit -m "fix: load P1 interaction layer"
          git push origin repair/stability
