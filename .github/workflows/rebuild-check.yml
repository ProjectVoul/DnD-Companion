name: D&D Companion rebuild checks
on:
  push:
    branches: [rebuild/react-engine]
  pull_request:
    branches: [main, rebuild/react-engine]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run test:rules
      - run: npm run test:invariants
      - run: npm run build
