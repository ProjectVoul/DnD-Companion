name: D&D Companion rebuild checks

on:
  push:
    branches: [rebuild/react-engine]
  pull_request:
    branches: [main, rebuild/react-engine]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm install
      - run: npm run check
      - run: npm run test:rules
      - run: npm run test:invariants
      - run: npm run build

      # Deployment smoke-check: Pages must receive Vite's production output,
      # never the TypeScript source entrypoint from index.html.
      - name: Verify deployable Vite output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          grep -Eq 'type="module"[[:space:]]+src="\./assets/[^" ]+\.js"' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/react-engine'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
