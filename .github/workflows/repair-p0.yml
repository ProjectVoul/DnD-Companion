name: Apply P0 JavaScript repairs

on:
  push:
    branches:
      - repair/stability

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")

          # 1. Remove the accidental duplicate selectedTags declaration.
          pattern = re.compile(
              r'\n\s*const selectedTags =\n\s*existingItem\n\s*\? existingItem\.tags \|\| \[\]\n\s*:\s*\[\];\n'
          )
          matches = list(pattern.finditer(text))
          if len(matches) > 1:
              start, end = matches[1].span()
              text = text[:start] + "\n" + text[end:]

          # 2. Read Properties from the actual form field instead of the
          # undefined propertiesText variable.
          old = '''    const properties =\n        propertiesText\n            .split(",")'''
          new = '''    const properties =\n        document.getElementById(\n            "inventory-form-properties"\n        ).value\n            .split(",")'''
          if old not in text:
              raise SystemExit("P0 repair failed: propertiesText block not found")
          text = text.replace(old, new, 1)

          # 3. initializeHome() does not exist in the current app.js.
          # The static home page is already initialized by index.html, so
          # remove the invalid call rather than inventing a second initializer.
          if "initializeHome();" not in text:
              raise SystemExit("P0 repair failed: initializeHome() call not found")
          text = text.replace("initializeHome();", "// Home is rendered by index.html; no JS initializer is required.", 1)

          # 4. Verify Dragon's Breath is only initialized after inventoryItems.
          inventory_pos = text.find("const inventoryItems =")
          breath_calls = [m.start() for m in re.finditer(r"updateDragonBreathUses\(\);", text)]
          if len(breath_calls) != 1:
              raise SystemExit(f"P0 verification failed: expected 1 Dragon's Breath initialization call, found {len(breath_calls)}")
          if breath_calls[0] < inventory_pos:
              raise SystemExit("P0 verification failed: Dragon's Breath initializes before inventoryItems")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit repairs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: restore JavaScript startup" || exit 0
          git push
