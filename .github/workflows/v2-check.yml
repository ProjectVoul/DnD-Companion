name: D&D Companion rules checks
on:
  push:
    branches: [repair/stability]
  pull_request:
    branches: [main, repair/stability]
jobs:
  syntax-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check dnd-data-v2.js
      - run: node --check dnd-content-v2.js
      - run: node --check dnd-content-v3-patch.js
      - run: node --check dnd-rules-v2.js
      - run: node --check dnd-class-features-v2.js
      - run: node --check dnd-class-features-v3-completion.js
      - run: node --check dnd-engine-v2.js
      - run: node --check dnd-engine-patch-v2.js
      - run: node --check dnd-engine-v3.js
      - run: node --check dnd-engine-v3-rules-patch.js
      - run: node --check dnd-class-resources-v3.js
      - run: node --check dnd-spellcasting-rules-v3.js
      - run: node --check dnd-combat-v3.js
      - run: node --check dnd-hp-sync-v3.js
      - run: node --check dnd-racial-traits-v3.js
      - run: node --check dnd-app-v2.js
      - run: node --check dnd-app-v3.js
      - run: node --check dnd-item-editor-v3.js
      - run: node --check dnd-equipment-presets-v3.js
      - run: node --check dnd-inventory-patch-v3.js
      - run: node --check dnd-defenses-patch-v3.js
      - run: node --check dnd-class-resources-ui-v3.js
      - run: node --check dnd-spellcasting-ui-v3.js
      - run: node --check dnd-combat-ui-v3.js
      - run: node --check dnd-feats-ui-v3.js
      - run: node --check dnd-builder-v2.js
      - run: node --check dnd-builder-stability-patch-v3.js
      - run: node --check dnd-sheet-enhancements-v2.js
      - run: node --check dnd-runtime-stability-v4.js
      - run: node tests/v2-smoke.js
      - run: node tests/v3-engine-smoke.js
      - run: node tests/v3-content-integrity.js
      - run: node tests/v3-ui-static.js
      - run: node tests/v3-spellcasting-smoke.js
      - run: node tests/v3-resource-smoke.js
      - run: node tests/v3-combat-smoke.js
      - run: node tests/v3-racial-smoke.js
