name: D&D Companion rules checks
on:
  push:
    branches: [repair/stability]
  pull_request:
    branches: [main, repair/stability]
jobs:
  syntax-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check dnd-data-v2.js
      - run: node --check dnd-content-v2.js
      - run: node --check dnd-content-v3-patch.js
      - run: node --check dnd-rules-v2.js
      - run: node --check dnd-class-features-v2.js
      - run: node --check dnd-engine-v2.js
      - run: node --check dnd-engine-patch-v2.js
      - run: node --check dnd-engine-v3.js
      - run: node --check dnd-engine-v3-rules-patch.js
      - run: node --check dnd-app-v2.js
      - run: node --check dnd-builder-v2.js
      - run: node --check dnd-sheet-enhancements-v2.js
      - run: node --check dnd-runtime-stability-v4.js
      - run: node tests/v2-smoke.js
      - run: node tests/v3-engine-smoke.js
      - run: node tests/v3-content-integrity.js
