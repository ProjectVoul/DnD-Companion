name: Validate D&D Companion
on:
  push:
    branches: [main, 'rebuild/react-engine']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR runs must validate the current head commit, not a stale cached ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate rebuild architecture
        if: github.ref_name == 'rebuild/react-engine' || github.head_ref == 'rebuild/react-engine'
        run: |
          npm install
          npm run check
          npm run test:rules
          npm run test:invariants
          npm run build
      - name: Validate legacy architecture
        if: github.ref_name != 'rebuild/react-engine' && github.head_ref != 'rebuild/react-engine'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)="([^"]+)"', html)
          missing=[]
          for ref in refs:
              path=ref.split('?',1)[0]
              if path.startswith(('http://','https://','#')):
                  continue
              if not Path(path).exists(): missing.append(path)
          if missing: raise SystemExit('Missing referenced assets: ' + ', '.join(missing))
          print(f'Validated {len(refs)} local/remote references.')
          PY
