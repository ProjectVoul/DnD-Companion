<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D&D Companion</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div id="app">

        <!-- HOME -->

        <header class="character-header">

            <div class="character-avatar">
                ⚔️
            </div>


            <div class="character-summary">

                <h1>Your Character</h1>

                <p>
                    Dragonborn
                </p>

                <p>
                    Paladin · Level 13
                </p>

                <p>
                    Lawful Good
                </p>

            </div>

        </header>


        <main>


            <!-- STATUS -->

            <section class="status-section">

                <div class="status-hp">

                    <div class="status-label">
                        ❤️ HP
                    </div>

                    <div class="hp-value">
                        <span id="current-hp">
                            100
                        </span>

                        <span class="hp-divider">
                            /
                        </span>

                        <span id="maximum-hp">
                            100
                        </span>
                    </div>

                </div>


                <div class="status-row">

                    <span>
                        🧠 Concentration
                    </span>

                    <button
                        id="concentration-toggle"
                        class="status-value status-toggle"
                        onclick="toggleConcentration()"
                    >
                        OFF
                    </button>

                </div>


                <div class="status-row">

                    <span>
                        🥀 Status
                    </span>

                    <button
                        id="status-selector"
                        class="status-value status-selector"
                        onclick="toggleStatusMenu()"
                    >
                        Normal ▾
                    </button>

                </div>


                <div
                    id="status-menu"
                    class="status-menu hidden"
                >

                    <label>
                        <input
                            type="checkbox"
                            value="Blinded"
                            onchange="toggleCondition(this)"
                        >
                        Blinded
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Charmed"
                            onchange="toggleCondition(this)"
                        >
                        Charmed
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Deafened"
                            onchange="toggleCondition(this)"
                        >
                        Deafened
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Frightened"
                            onchange="toggleCondition(this)"
                        >
                        Frightened
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Grappled"
                            onchange="toggleCondition(this)"
                        >
                        Grappled
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Incapacitated"
                            onchange="toggleCondition(this)"
                        >
                        Incapacitated
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Invisible"
                            onchange="toggleCondition(this)"
                        >
                        Invisible
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Paralyzed"
                            onchange="toggleCondition(this)"
                        >
                        Paralyzed
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Petrified"
                            onchange="toggleCondition(this)"
                        >
                        Petrified
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Poisoned"
                            onchange="toggleCondition(this)"
                        >
                        Poisoned
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Prone"
                            onchange="toggleCondition(this)"
                        >
                        Prone
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Restrained"
                            onchange="toggleCondition(this)"
                        >
                        Restrained
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Stunned"
                            onchange="toggleCondition(this)"
                        >
                        Stunned
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            value="Unconscious"
                            onchange="toggleCondition(this)"
                        >
                        Unconscious
                    </label>

                </div>


                <div class="status-row">

                    <span>
                        🎲 Hit Dice
                    </span>

                    <span
                        id="hit-dice-value"
                        class="status-value"
                    >
                        5 / 5
                    </span>

                </div>


                <div class="death-saves">

                    <div class="death-saves-title">
                        💀 Death Saves
                    </div>

                    <div class="death-saves-groups">

                        <div>
                            <span>Successes</span>

                            <div class="save-dots">
                                <button
                                    class="save-dot"
                                ></button>

                                <button
                                    class="save-dot"
                                ></button>

                                <button
                                    class="save-dot"
                                ></button>
                            </div>
                        </div>


                        <div>
                            <span>Failures</span>

                            <div class="save-dots">
                                <button
                                    class="save-dot failure"
                                ></button>

                                <button
                                    class="save-dot failure"
                                ></button>

                                <button
                                    class="save-dot failure"
                                ></button>
                            </div>
                        </div>

                    </div>

                </div>

            </section>


            <!-- MAIN SECTIONS -->

            <section class="main-menu">

                <button
                    class="main-menu-button"
                    onclick="openSection('abilities')"
                >

                    <span class="main-menu-icon">
                        ⚔️
                    </span>

                    <span>
                        Abilities
                    </span>

                    <span class="main-menu-arrow">
                        ›
                    </span>

                </button>


                <button
                    class="main-menu-button"
                    onclick="openSection('inventory')"
                >

                    <span class="main-menu-icon">
                        🎒
                    </span>

                    <span>
                        Inventory
                    </span>

                    <span class="main-menu-arrow">
                        ›
                    </span>

                </button>


                <button
                    class="main-menu-button"
                    onclick="openSection('spells')"
                >

                    <span class="main-menu-icon">
                        ✨
                    </span>

                    <span>
                        Spells
                    </span>

                    <span class="main-menu-arrow">
                        ›
                    </span>

                </button>

            </section>

        </main>

    </div>


    <script src="app.js"></script>

</body>

</html>
