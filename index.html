<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Companion</title>
<link rel="stylesheet" href="style.css?v=20260822-sheetrepair7">
<link rel="stylesheet" href="character-sheet.css?v=20260822-sheetrepair7">
</head>
<body>
<div id="app">
<header class="character-header" id="character-entry" role="button" tabindex="0" aria-label="Open Character Sheet" title="Open Character Sheet">
<div class="character-avatar">⚔️</div>
<div class="character-summary"><h1>Your Character</h1><p>Dragonborn</p><p>Paladin · Level 13</p><p>Lawful Good</p></div>
</header>
<main><section class="status-section">
<div class="status-hp"><div class="status-label">❤️ HP</div><div class="hp-controls"><button class="hp-button" onclick="changeHP(-1)">−</button><div class="hp-value"><span id="current-hp">100</span><span class="hp-divider">/</span><span id="maximum-hp">100</span></div><button class="hp-button" onclick="changeHP(1)">+</button></div></div>
<div class="status-row"><span>🧠 Concentration</span><button id="concentration-toggle" class="status-value status-toggle" onclick="toggleConcentration()">OFF</button></div>
<div class="status-row status-row-conditions"><div class="status-name">🥀 Status</div><button id="status-selector" class="status-value status-selector" onclick="toggleStatusMenu()">Normal ▾</button></div><div id="active-conditions" class="active-conditions hidden"></div><div id="status-menu" class="status-menu hidden"></div>
<div class="status-row"><span>🎲 Hit Dice</span><div class="resource-controls"><button onclick="changeHitDice(-1)">−</button><span id="hit-dice-value" class="status-value">5 / 5</span><button onclick="changeHitDice(1)">+</button></div></div>
<div class="death-saves"><div class="death-saves-title">💀 Death Saves</div><div class="death-saves-groups"><div><span>Successes</span><div class="save-dots"><button class="save-dot" onclick="toggleDeathSave('success',0)"></button><button class="save-dot" onclick="toggleDeathSave('success',1)"></button><button class="save-dot" onclick="toggleDeathSave('success',2)"></button></div></div><div><span>Failures</span><div class="save-dots"><button class="save-dot failure" onclick="toggleDeathSave('failure',0)"></button><button class="save-dot failure" onclick="toggleDeathSave('failure',1)"></button><button class="save-dot failure" onclick="toggleDeathSave('failure',2)"></button></div></div></div></div>
</section><section class="main-menu"><button class="main-menu-button" onclick="openSection('abilities')"><span class="main-menu-icon">⚔️</span><span>Abilities</span><span class="main-menu-arrow">›</span></button><button class="main-menu-button" onclick="openSection('inventory')"><span class="main-menu-icon">🎒</span><span>Inventory</span><span class="main-menu-arrow">›</span></button><button class="main-menu-button" onclick="openSection('spells')"><span class="main-menu-icon">✨</span><span>Spells</span><span class="main-menu-arrow">›</span></button><button class="main-menu-button" onclick="openRestMenu()"><span class="main-menu-icon">🌙</span><span>Rest</span><span class="main-menu-arrow">›</span></button></section></main></div>
<script src="app.js?v=20260822-sheetrepair7"></script><script src="character-engine.js?v=20260822-sheetrepair7"></script><script src="character-sheet-v3.js?v=20260822-sheetrepair7"></script><script src="character-engine-rules.js?v=20260822-sheetrepair7"></script><script src="character-engine-options-v2.js?v=20260822-sheetrepair7"></script><script src="character-engine-features.js?v=20260822-sheetrepair7"></script><script src="character-engine-paladin-2014.js?v=20260822-sheetrepair7"></script><script src="character-engine-class-sync-v3.js?v=20260822-sheetrepair7"></script><script src="character-engine-weapon-rules.js?v=20260822-sheetrepair7"></script><script src="character-engine-live-bridge.js?v=20260822-sheetrepair7"></script><script src="character-sheet-navigation.js?v=20260822-sheetrepair7"></script><script src="p1-recovery.js?v=20260822-sheetrepair7"></script><script src="p1-interaction.js?v=20260822-sheetrepair7"></script><script src="p1-inventory-fix.js?v=20260822-sheetrepair7"></script><script src="character-sheet-repair-v5.js?v=20260822-sheetrepair7"></script><script src="character-sheet-repair-v5-hotfix.js?v=20260822-sheetrepair7"></script><script src="character-sheet-repair-v5-form-hotfix.js?v=20260822-sheetrepair7"></script><script src="character-sheet-stability-v6.js?v=20260822-sheetrepair7"></script>
</body></html>
