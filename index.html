<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Companion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- HEADER -->
        <header class="app-header">
            <div>
                <h1>D&D Companion</h1>
                <p>Character Companion</p>
            </div>
        </header>


        <!-- CHARACTER -->
        <main>

            <section class="character-card">

                <div class="character-image">
                    <div class="placeholder-image">
                        ⚔️
                    </div>
                </div>

                <div class="character-info">
                    <h2>Your Character</h2>
                    <p>Paladin · Level 13</p>

                    <div class="quick-stats">
                        <div class="stat">
                            <span class="stat-label">HP</span>
                            <span class="stat-value">100 / 100</span>
                        </div>

                        <div class="stat">
                            <span class="stat-label">AC</span>
                            <span class="stat-value">20</span>
                        </div>
                    </div>
                </div>

            </section>


            <!-- QUICK MENU -->
            <section class="quick-menu">

<button class="menu-button" onclick="showSpells()">
    <span class="menu-icon">✨</span>
    <span>Spells</span>
</button>

                <button class="menu-button">
                    <span class="menu-icon">⚔️</span>
                    <span>Abilities</span>
                </button>

                <button class="menu-button">
                    <span class="menu-icon">🎒</span>
                    <span>Inventory</span>
                </button>

                <button class="menu-button">
                    <span class="menu-icon">🛡️</span>
                    <span>Equipment</span>
                </button>

                <button class="menu-button">
                    <span class="menu-icon">🧬</span>
                    <span>Traits</span>
                </button>

                <button class="menu-button">
                    <span class="menu-icon">📜</span>
                    <span>Character</span>
                </button>

            </section>


            <!-- RESOURCES -->
            <section class="resources-section">

                <h2>Resources</h2>

                <div class="resource-list">

                    <div class="resource-card">
                        <div>
                            <h3>Channel Divinity</h3>
                            <p>Long Rest</p>
                        </div>

                        <strong>1 / 1</strong>
                    </div>

                    <div class="resource-card">
                        <div>
                            <h3>Divine Sense</h3>
                            <p>Long Rest</p>
                        </div>

                        <strong>5 / 5</strong>
                    </div>

                    <div class="resource-card">
                        <div>
                            <h3>Lay on Hands</h3>
                            <p>Long Rest</p>
                        </div>

                        <strong>65 / 65</strong>
                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
